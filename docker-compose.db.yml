services:
  postgres:
    image: postgres:16-alpine
    container_name: phukettours-postgres-dev
    restart: unless-stopped
    ports:
      # Bound strictly to loopback interface 127.0.0.1 to prevent external network access
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-tour_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password must be provided in .env}
      POSTGRES_DB: ${DB_NAME:-tour_db}
    volumes:
      # Named volume guarantees database data persists across container restarts and stops
      - phukettours_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  phukettours_pgdata:
    name: phukettours_pgdata
