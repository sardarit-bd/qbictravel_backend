name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/qbictravel_backend
            git fetch https://github.com/sardarit-bd/qbictravel_backend.git main
            git reset --hard FETCH_HEAD
            docker compose -f docker-compose.prod.yml build qbictravel-api
            docker compose -f docker-compose.prod.yml up -d --force-recreate qbictravel-api
            docker compose -f docker-compose.prod.yml ps
